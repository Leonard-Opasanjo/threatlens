[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.1.0"
description = "Threat-intelligence analyser: import, normalise, deduplicate, enrich and score indicators of compromise, offline by default, with a dashboard and investigation reports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Leonard Opasanjo"}]
keywords = ["threat-intelligence", "ioc", "security", "soc", "fastapi", "incident-response"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
threatlens = "threatlens.cli:main"

[project.urls]
Homepage = "https://github.com/Leonard-Opasanjo/threatlens"
Issues = "https://github.com/Leonard-Opasanjo/threatlens/issues"

[tool.setuptools.packages.find]
include = ["threatlens*"]

[tool.setuptools.package-data]
threatlens = ["templates/*.html", "feeds/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
